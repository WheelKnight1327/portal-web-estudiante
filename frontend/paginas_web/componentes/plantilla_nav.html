<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla</title>
    <!-- Bootstrap 5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personal -->
    <link href="/css/estilos.css" rel="stylesheet">
</head>

<body style="padding-top:70px;"> <!-- el padding es para dejar espacio para la barra superior -->
    <!-- Aquí se cargará la navbar -->
    <div id="navbar"></div>
    <div class="container-fluid">
        <div class="row">
            <button class="btn btn-primary d-md-none mt-3" data-bs-toggle="collapse" data-bs-target="#sideBarMenu">
                Contenido de la página
            </button>
            <aside class="col-md-3 col-lg-2 bg-light border-end">
                <div class="collapse d-md-block" id="sideBarMenu">
                    <!-- <div class="position-sticky pt-3" style="top:20px;"> -->
                    <strong class="mt-3">Contenido:</strong>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">¿Qué es?</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Requisitos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Tiempo de solicitud</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Oficina encargada</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Vínculos utiles</a>
                        </li>
                    </ul>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-3 min-vh-100">
                <h1>Contenido principal</h1>
            </main>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script para cargar la navbar -->
    <script>
        fetch('/navbar.html')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar la navbar');
                return response.text();
            })
            .then(data => {
                //Cargar navbar en div con id
                document.getElementById('navbar').innerHTML = data;

                //iniciar los dropwdown por medio de boostrap
                const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
                dropdownElementList.forEach(dropdownToggleEl => {
                    new bootstrap.Dropdown(dropdownToggleEl);
                });

                //recargar boton de 3 lineas por boostrap
                const navbarCollapse = document.getElementById('navbarScroll');
                if (navbarCollapse) {
                    new bootstrap.Collapse(navbarCollapse, {
                        toggle: false //para que no se abra al cargar
                    });
                }
            })
            .catch(error => console.error('Error al cargar navbar:', error));
    </script>
</body>

</html>
