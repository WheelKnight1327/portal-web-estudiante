<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncio</title>
    <link rel="icon" type="image/x-icon" href="https://www.ceti.mx/images/Ceti.png">
    <!-- Bootstrap 5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personal -->
    <link href="/css/estilos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="padding-top:70px;"> <!-- el padding es para dejar espacio para la barra superior -->
    <!--Barra de navegación superior-->
    <div id="navbar"></div>
    <!-- <div>
        <div class="row">
            <div class="col-12 col-md-6 bg-light border-end p-3">
                <img src="..\imagenes\comunidado_modalidadVirtual.jpg" 
                    class="img-fluid w-100"
                    style="max-height: 100vh; object-fit: contain;"
                    alt="Anuncio seleccionado. SI no se visualiza, recargue la pagina.">
            </div>
            <div class="col-12 col-md-6 p-2">Columna derecha</div>
        </div>
    </div> -->
    <div class="container-fluid">
        <!--comportamiento de renglon especial-->
        <div class="row altura-flexible">
            <div class="col-12 col-md-6 bg-light border-end d-flex align-items-center justify-content-center">
                <!--clase especial de imagen-->
                <img id="visAnuncio" src="" class="img-fluid p-3 img-anuncio" alt="Anuncio seleccionado.">
            </div>
            <div class="col-12 col-md-6 p-2">
                <h1 id="tituloAnucio"></h1>
                <p id="contenidoAnuncio"></p>
            </div>
        </div>
    </div>
    <!-- Script para cargar la navbar -->
    <script>
        fetch('/navbar.html')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar la navbar');
                return response.text();
            })
            .then(data => {
                //Cargar navbar en div con id
                document.getElementById('navbar').innerHTML = data;

                //iniciar los dropwdown por medio de boostrap
                const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
                dropdownElementList.forEach(dropdownToggleEl => {
                    new bootstrap.Dropdown(dropdownToggleEl);
                });

                //recargar boton de 3 lineas por boostrap
                const navbarCollapse = document.getElementById('navbarScroll');
                if (navbarCollapse) {
                    new bootstrap.Collapse(navbarCollapse, {
                        toggle: false //para que no se abra al cargar
                    });
                }
            })
            .catch(error => console.error('Error al cargar navbar:', error));
    </script>
    <!--Libreria especifica para limpiar html de codigo malicioso-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script>
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const query = params.get("id");

            if (query) {
                solicitarAnuncio(query);
            }
            else {
                console.error("No se obuvo id de anuncio.");
            }
        }

        function solicitarAnuncio(queryParam) {
            fetch(`http://localhost:3000/obtener-anuncio?a=${encodeURIComponent(queryParam)}`)
                .then(an => an.json())
                .then(anJSON => {
                    if (!anJSON) {
                        console.log("No se encontró el anuncio."); //mensaje de la consola
                        alert("No se encontró un anuncio que cargar"); //mensaje al usuario
                    }
                    else {
                        cargarAnuncio(anJSON)
                    }
                })
                .catch(error => { //en caso de ocurrir un anuncio
                    console.error("Error en fecth:", error); //mensaje en la consola
                })
        }
        //al recibir anuncio en HTML, lo carga a la página por elementos HTML
        function cargarAnuncio(anuncioJSON) {
            const contenidoLimpio = DOMPurify.sanitize(anuncioJSON.contenido); //limpiando contenido
            document.getElementById("visAnuncio").src = "/imagenes/img_anuncios/" + anuncioJSON.imagen; // carga imagen.
            document.getElementById("tituloAnucio").textContent = anuncioJSON.titulo; //carga titulo
            //document.getElementById("contenidoAnuncio").textContent = anuncioJSON.contenido;
            document.getElementById("contenidoAnuncio").innerHTML = contenidoLimpio; //carga seccion HTML del contenido
        }
    </script>
    <footer>
        <!--Aqui irá contenido del pie de pagina-->
    </footer>
</body>

</html>
