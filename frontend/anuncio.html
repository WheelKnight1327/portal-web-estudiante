<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncio</title>
    <link rel="icon" type="image/x-icon" href="https://www.ceti.mx/images/Ceti.png">
    <!-- Bootstrap 5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personal -->
    <link href="/css/estilos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <!--Barra de navegación superior-->
    <div id="navbar"></div>
    <div class="container-fluid">
        <!--comportamiento de renglon especial-->
        <div class="row altura-flexible">
            <div class="col-12 col-md-6 border-end d-flex align-items-center justify-content-center seccionAnuncio">
                <!--clase especial de imagen-->
                <img id="visAnuncio" src="" class="img-fluid p-3 img-anuncio" alt="Haga click para expandir la imagen.">
            </div>
            <div class="col-12 col-md-6 p-2">
                <h1 id="tituloAnucio"></h1>
                <p id="contenidoAnuncio"></p>
            </div>
        </div>
    </div>
    <!-- Script para cargar la navbar -->
    <script>
        fetch('/navbar.html')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar la navbar');
                return response.text();
            })
            .then(data => {
                //Cargar navbar en div con id
                document.getElementById('navbar').innerHTML = data;

                //iniciar los dropwdown por medio de boostrap
                const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
                dropdownElementList.forEach(dropdownToggleEl => {
                    new bootstrap.Dropdown(dropdownToggleEl);
                });

                //recargar boton de 3 lineas por boostrap
                const navbarCollapse = document.getElementById('navbarScroll');
                if (navbarCollapse) {
                    new bootstrap.Collapse(navbarCollapse, {
                        toggle: false //para que no se abra al cargar
                    });
                }
            })
            .catch(error => console.error('Error al cargar navbar:', error));
    </script>
    <!--Libreria especifica para limpiar html de codigo malicioso-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script>
        //cambiar la ruta de inicio de pendiendo si es local o desde un servidor
        const API_BASE =
            location.hostname === "localhost" || //local
                location.hostname === "127.0.0.1" //servidor
                ? "http://localhost:3000"
                : "/api"; //direcionamiento del servidor

        window.onload = function () { //al cargar la pagina
            const params = new URLSearchParams(window.location.search);
            const query = params.get("id"); //obtiene id de la URL

            if (query) { //si hay, pide imagen
                solicitarAnuncio(query);
            }
            else {
                console.error("No se obuvo id de anuncio.");
            }
        }

        function solicitarAnuncio(queryParam) {
            fetch(`${API_BASE}/obtener-anuncio?a=${encodeURIComponent(queryParam)}`)
                .then(an => an.json())
                .then(anJSON => {
                    if (!anJSON) {
                        console.log("No se encontró el anuncio."); //mensaje de la consola
                        alert("No se encontró un anuncio que cargar"); //mensaje al usuario
                    }
                    else {
                        cargarAnuncio(anJSON)
                    }
                })
                .catch(error => { //en caso de ocurrir un anuncio
                    console.error("Error en fecth:", error); //mensaje en la consola
                })
        }
        //al recibir anuncio en HTML, lo carga a la página por elementos HTML
        function cargarAnuncio(anuncioJSON) {
            const contenidoLimpio = DOMPurify.sanitize(anuncioJSON.contenido); //limpiando contenido
            document.getElementById("visAnuncio").src = "/imagenes/img_anuncios/" + anuncioJSON.imagen; // carga imagen.
            document.getElementById("tituloAnucio").textContent = anuncioJSON.titulo; //carga titulo
            //document.getElementById("contenidoAnuncio").textContent = anuncioJSON.contenido;
            document.getElementById("contenidoAnuncio").innerHTML = contenidoLimpio; //carga seccion HTML del contenido
        }
        //seccion de código para imagen que se expande
        const imagen = document.getElementById('visAnuncio'); //elem de imagen de anuncio

        imagen.addEventListener('click', () => { //al darle click a la imagen
            imagen.classList.toggle('full-screen'); //habilita la propiedad fullscreen

            //al expandir, el scroll se bloquea
            if (imagen.classList.contains('full-screen')) { 
                //imagen.classList.add('full-screen'); //agrega propiedad fullscreen
                document.body.style.overflow = 'hidden';
            } else {
                //imagen.classList.remove('full-screen'); //quita propiedad fullscreen
                document.body.style.overflow = 'auto';
            }
        });
    </script>
    <footer>
        <!--Aqui irá contenido del pie de pagina-->
    </footer>
</body>

</html>
