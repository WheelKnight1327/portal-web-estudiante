<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Anuncio</title>
    <link rel="icon" type="image/x-icon" href="https://www.ceti.mx/images/Ceti.png">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Tipografia de Inter-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- estilos -->
    <link href="/css/estilos.css" rel="stylesheet">
</head>

<body style="padding-top:70px;">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">
                <img src="/imagenes/img_diseno/logo_ceti.png" alt="Logo" width="40" height="40" class="d-inline-block">
                Publicar anuncio del CETI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <!--ícono que aparece cuando se acorta barra superior-->
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarScroll">
                <!--Atributos de barra superior que incluye comportamiento por tamaño disponible-->
                <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" onclick="cerrarSesion()">Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-11 col-md-8 col-lg-6">
                <div class="card shadow mt-4">
                    <div class="card-body">
                        <h2 class="text-center mb-4">
                            Crear Anuncio
                        </h2>
                        <!-- Alerta -->
                        <div id="mensaje" class="alert d-none" role="alert">
                        </div>
                        <!-- formulario -->
                        <form id="formAnuncio">
                            <!-- titulo -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Título
                                </label>
                                <input type="text" class="form-control" id="titulo" required>
                            </div>
                            <!-- descripcion -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Descripción
                                </label>
                                <input type="text" class="form-control" id="descripcion" required>
                            </div>
                            <!-- contenido -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Contenido
                                </label>
                                <textarea class="form-control" id="contenido" rows="6" required></textarea>
                            </div>
                            <!-- imagen -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Imagen
                                </label>
                                <input type="file" class="form-control" id="imagen" accept="image/*" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Publicar anuncio
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- instrucciones subir anuncio -->
    <script>
        //cambiar la ruta de inicio de pendiendo si es local o desde un servidor
        const API_BASE =
            location.hostname === "localhost" || //local
                location.hostname === "127.0.0.1" //servidor
                ? "http://localhost:3000"
                : "/api"; //direcionamiento del servidor

        const token = localStorage.getItem('token'); //obtiene token local
        if (!token) { //evita que se ingrese sin el token
            window.location.href = '/login.html';
        }
        //método del formulario
        const formulario = document.getElementById('formAnuncio');
        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            //formdata para encapsular datos en JSON
            const formData = new FormData();
            //agregado por dato
            formData.append(
                'titulo',
                document.getElementById('titulo').value
            );

            formData.append(
                'descripcion',
                document.getElementById('descripcion').value
            );

            formData.append(
                'contenido',
                document.getElementById('contenido').value
            );

            formData.append(
                'imagen',
                document.getElementById('imagen').files[0]
            );
            try { //llamada a API
                const respuesta = await fetch(`${API_BASE}/api/subir-anuncio`, {
                    method: 'POST',

                    headers: {//agrega el token
                        'Authorization': `Bearer ${token}`
                    },

                    body: formData
                });
                const datos = await respuesta.json(); //respuesta de API
                console.log(datos);
                if (respuesta.ok) { //se logró subir el anuncio
                    mensaje.classList.remove('d-none', 'alert-danger');

                    mensaje.classList.add('alert-success');

                    mensaje.textContent = 'Anuncio publicado correctamente';
                    formulario.reset();
                    return;
                } else { //mensaje de error
                    mensaje.classList.remove('d-none', 'alert-success');
                    mensaje.classList.add('alert-danger');
                    mensaje.textContent = datos.mensaje;
                }
            } catch (error) { //error en llamada de API
                console.error(error);
                mensaje.classList.remove('d-none', 'alert-success');
                mensaje.classList.add('alert-danger');
                mensaje.textContent = 'Error del servidor';
            }

        });

        function cerrarSesion() {
            localStorage.removeItem('token'); //quita el token de de almacenamiento local
            window.location.href = '/index.html';
        };
    </script>

</body>

</html>
