<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Anuncio</title>
    <link rel="icon" type="image/x-icon" href="https://www.ceti.mx/images/Ceti.png">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- estilos -->
    <link href="/css/estilos.css" rel="stylesheet">
</head>

<body style="padding-top:70px;">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">
                <img src="/imagenes/img_diseno/logo_ceti.png" alt="Logo" width="40" height="40" class="d-inline-block">
                Publicar anuncio del CETI
            </a>
            <!---->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <!--ícono que aparece cuando se acorta barra superior-->
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarScroll">
                <!--Atributos de barra superior que incluye comportamiento por tamaño disponible-->
                <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" onclick="cerrarSesion()">Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-11 col-md-8 col-lg-6">
                <div class="card shadow mt-4">
                    <div class="card-body">
                        <h2 class="text-center mb-4">
                            Crear Anuncio
                        </h2>
                        <!-- laerta -->
                        <div id="mensaje" class="alert d-none">
                        </div>
                        <!-- formulario -->
                        <form id="formAnuncio">
                            <!-- titulo -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Título
                                </label>
                                <input type="text" class="form-control" id="titulo" required>
                            </div>
                            <!-- descripcion -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Descripción
                                </label>
                                <input type="text" class="form-control" id="descripcion" required>
                            </div>
                            <!-- contenido -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Contenido
                                </label>
                                <textarea class="form-control" id="contenido" rows="6" required></textarea>
                            </div>
                            <!-- imagen -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Imagen
                                </label>
                                <input type="file" class="form-control" id="imagen" accept="image/*" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Publicar anuncio
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- navbar -->
    <script>
        fetch('/navbar.html')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar la navbar');
                return response.text();
            })
            .then(data => {
                //Cargar navbar en div con id
                document.getElementById('navbar').innerHTML = data;

                //iniciar los dropwdown por medio de boostrap
                const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
                dropdownElementList.forEach(dropdownToggleEl => {
                    new bootstrap.Dropdown(dropdownToggleEl);
                });

                //recargar boton de 3 lineas por boostrap
                const navbarCollapse = document.getElementById('navbarScroll');
                if (navbarCollapse) {
                    new bootstrap.Collapse(navbarCollapse, {
                        toggle: false //para que no se abra al cargar
                    });
                }
            })
            .catch(error => console.error('Error al cargar navbar:', error));
    </script>
    <!-- instrucciones subir anuncio -->
    <script>
        const token = localStorage.getItem('token'); //obtiene token local
        if (!token) { //evita que se ingrese sin el token
            window.location.href = '/login.html';
        }

        const formulario = document.getElementById('formAnuncio');
        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            //formdata
            const formData = new FormData();
            formData.append(
                'titulo',
                document.getElementById('titulo').value
            );

            formData.append(
                'descripcion',
                document.getElementById('descripcion').value
            );

            formData.append(
                'contenido',
                document.getElementById('contenido').value
            );

            formData.append(
                'imagen',
                document.getElementById('imagen').files[0]
            );

            try {
                const respuesta = await fetch('/api/subir-anuncio', {
                    method: 'POST',

                    headers: {//agrega el token
                        'Authorization': `Bearer ${token}`
                    },

                    body: formData
                });
                const datos = await respuesta.json();

                if (respuesta.ok) {

                    mensaje.classList.remove('d-none', 'alert-danger');

                    mensaje.classList.add('alert-success');

                    mensaje.textContent = 'Anuncio publicado correctamente';

                    formulario.reset();

                } else {
                    mensaje.classList.remove('d-none', 'alert-success');
                    mensaje.classList.add('alert-danger');
                    mensaje.textContent = datos.mensaje;
                }
            } catch (error) {
                console.error(error);
                mensaje.classList.remove('d-none', 'alert-success');
                mensaje.classList.add('alert-danger');
                mensaje.textContent = 'Error del servidor';
            }

        });

        function cerrarSesion() {
            localStorage.removeItem('token');
            window.location.href = '/index.html';
        };
    </script>

</body>

</html>
